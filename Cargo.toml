[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ose-math = { path = "crates/ose-math" }
ose-data = { path = "crates/ose-data" }
ose-sim = { path = "crates/ose-sim" }
ose-net = { path = "crates/ose-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
postcard = { version = "1", features = ["alloc"] }
bevy_ecs = "0.15"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

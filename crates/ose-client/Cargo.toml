[package]
name = "ose-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = "0.3"
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "CssStyleDeclaration", "DomRect", "Location", "Performance",
  "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "ErrorEvent",
  "MouseEvent", "WheelEvent", "KeyboardEvent", "EventTarget", "DomTokenList", "console",
] }
ose-net = { workspace = true }
ose-data = { workspace = true }
ose-math = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

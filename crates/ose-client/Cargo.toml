[package]
name = "ose-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "CssStyleDeclaration", "DomRect", "Location", "Performance",
  "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "ErrorEvent",
  "MouseEvent", "WheelEvent", "KeyboardEvent", "EventTarget", "DomTokenList", "console", "HtmlInputElement", "HtmlSelectElement", "Storage", "Request", "RequestInit", "Response", "Headers", "Blob", "ImageBitmap", "HtmlImageElement", "ImageData", "ImageBitmapOptions", "PremultiplyAlpha", "ColorSpaceConversion",
  "AudioContext", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "AudioParam", "GainNode", "HtmlAudioElement", "HtmlMediaElement",
] }
ose-net = { workspace = true }
ose-data = { workspace = true }
ose-math = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wgpu = "30"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }

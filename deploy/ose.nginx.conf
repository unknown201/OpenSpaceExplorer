# Public game host: authentication and campaign membership are handled by OSE.
server {
    server_name ose.jfly.dev;
    location / {
        proxy_pass http://ose.lan:7777;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/proxy-no-auth.conf;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ose.jfly.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ose.jfly.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name ose.jfly.dev;
    return 301 https://$host$request_uri;
}

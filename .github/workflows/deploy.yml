# On every push to main: build the Linux server (static musl binary) and the WASM client, then scp the
# release tarball to the ose container on the house Proxmox host (docs/DEPLOY.md) and install it there
# with deploy/install.sh. Nothing is stored on GitHub: no artifacts, no packages.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   OSE_DEPLOY_HOST  address GitHub's runners reach the house on (the one PrivateCoPilot uses)
#   OSE_DEPLOY_PORT  its forwarded SSH port
#   OSE_DEPLOY_USER  user on the ose container (deploy/install.sh needs root)
#   OSE_DEPLOY_KEY   that user's private key (OpenSSH format)
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # trunk and the tools it fetches (wasm-bindgen, wasm-opt) come from GitHub releases, which 502/503/504
      # now and then: keep them between runs, and retry the downloads that still happen.
      - name: Cache trunk and its tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/trunk
            ~/.cache/trunk
          key: trunk-${{ env.TRUNK_VERSION }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/ose-client/index.html') }}
          restore-keys: |
            trunk-${{ env.TRUNK_VERSION }}-${{ runner.os }}-
      - name: Install trunk
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ -x ~/.local/bin/trunk ]; then ~/.local/bin/trunk --version; exit 0; fi
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$RUNNER_TEMP/trunk.tar.gz" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C ~/.local/bin trunk
          ~/.local/bin/trunk --version
      # ose-server bundles SQLite (rusqlite "bundled"), C code that the musl target needs a musl C
      # compiler for; Ubuntu's musl-tools provides musl-gcc and cc-rs is pointed at it.
      - name: Install musl C toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build server (static Linux binary)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release -p ose-server --target x86_64-unknown-linux-musl
      - name: Build web client
        run: |
          cd crates/ose-client
          # on a cold cache trunk downloads wasm-bindgen and wasm-opt itself: ride out release-download outages
          for attempt in 1 2 3 4; do
            trunk build --release --dist ../../target/web && exit 0
            echo "trunk build failed (attempt $attempt of 4)"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Precompress web client
        run: python3 tools/precompress.py target/web
      - name: Package release
        run: |
          rel=target/release-pkg
          mkdir -p "$rel/web"
          cp target/x86_64-unknown-linux-musl/release/ose-server "$rel/"
          cp target/web/index.html target/web/*.wasm target/web/*.js "$rel/web/"
          cp target/web/*.gz "$rel/web/"
          cp deploy/ose.service deploy/install.sh "$rel/"
          tar --owner=0 --group=0 -czf ose-release.tar.gz -C "$rel" .
          ls -la ose-release.tar.gz
      - name: Deploy to the ose container
        env:
          HOST: ${{ secrets.OSE_DEPLOY_HOST }}
          PORT: ${{ secrets.OSE_DEPLOY_PORT }}
          USER: ${{ secrets.OSE_DEPLOY_USER }}
          KEY: ${{ secrets.OSE_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KEY" > "$key"
          chmod 600 "$key"
          opts="-i $key -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          id="${GITHUB_SHA::7}"
          scp $opts -P "$PORT" ose-release.tar.gz "$USER@$HOST:/tmp/ose-release.tar.gz"
          ssh $opts -p "$PORT" "$USER@$HOST" \
            "mkdir -p /tmp/ose-r && tar --no-same-owner -xzf /tmp/ose-release.tar.gz -C /tmp/ose-r ./install.sh && sh /tmp/ose-r/install.sh /tmp/ose-release.tar.gz $id"
